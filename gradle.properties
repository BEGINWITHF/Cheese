# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.4
# Range of Minecraft versions this build supports (used in the jar name/version).
mc_range=1.20.3-1.20.4
loader_version=0.20.1
loom_version=1.15.5

# Mod Properties
mod_version=2.2.0-beta
maven_group=com.example
archives_base_name=cheese

# Dependencies
fabric_api_version=0.97.3+1.20.4
java_version=17

# JDK toolchain detection
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK_HOME,JDK21_HOME,JDK25_HOME
